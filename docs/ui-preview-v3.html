<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dailyuse · 界面方向（含协作群组）</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #E9E6E0;
    color: #1a1a1a;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  header { padding: 48px 24px 4px; text-align: center; }
  .eyebrow {
    font-size: 10px; letter-spacing: 3.4px; color: #98938a;
    text-transform: uppercase; margin-bottom: 12px;
  }
  header h1 { font-size: 25px; font-weight: 600; letter-spacing: .6px; }
  header p { margin-top: 10px; font-size: 12.5px; color: #6f6a62; line-height: 1.7; }
  header .hint { margin-top: 4px; font-size: 11px; color: #a19b91; }

  .stage {
    display: flex; gap: 40px; justify-content: center; flex-wrap: wrap;
    padding: 40px 24px 80px; align-items: flex-start;
  }
  .wrap { width: 320px; }

  /* ================= 手机外壳 ================= */
  .phone {
    position: relative; width: 320px; height: 680px;
    border: 9px solid #17181a; border-radius: 44px; overflow: hidden;
    display: flex; flex-direction: column;
    background: var(--bg);
    box-shadow: 0 22px 48px rgba(40,35,28,.18), 0 2px 6px rgba(40,35,28,.08);
    --bg:#fff; --fg:#111; --muted:#8a8a8a; --accent:#4F6EF7; --accent2:#9DB2FF;
    --line:#e8e8e8; --card:#fff; --radius:20px; --shadow:none;
    --grad: linear-gradient(135deg, #6C8BFF, #4F6EF7);
    --title-font: "PingFang SC", sans-serif;
  }

  /* D · 奶油橙 */
  .phone[data-theme="cream"] {
    --bg:#FDF8F3; --fg:#2B2320; --muted:#9C8F86; --accent:#F2703C; --accent2:#FFB088;
    --line:#F0E5DA; --card:#FFFFFF; --radius:22px;
    --shadow:0 6px 20px rgba(240,112,60,.08);
    --grad: linear-gradient(135deg, #FF8A5B, #F2703C);
  }
  /* E · 青黛 */
  .phone[data-theme="azure"] {
    --bg:#F4F6FB; --fg:#16203A; --muted:#8A94AB; --accent:#3B5BDB; --accent2:#5C7CFA;
    --line:#E6EAF4; --card:#FFFFFF; --radius:20px;
    --shadow:0 6px 20px rgba(59,91,219,.08);
    --grad: linear-gradient(135deg, #5C7CFA, #3B5BDB);
  }
  /* F · 墨韵 */
  .phone[data-theme="ink"] {
    --bg:#F3F1EA; --fg:#1E2B24; --muted:#8B8B7E; --accent:#2C4A3B; --accent2:#C9A227;
    --line:#E3DFD2; --card:#FBF9F2; --radius:16px;
    --shadow:0 4px 16px rgba(44,74,59,.07);
    --grad: linear-gradient(135deg, #3A5C4B, #22392E);
    --title-font: "Songti SC", "STSong", serif;
  }

  .status {
    flex: 0 0 30px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px; font-size: 10px; color: var(--fg); opacity: .7;
  }

  .screen { flex: 1; overflow-y: auto; padding: 0 18px 8px; scrollbar-width: none; }
  .screen::-webkit-scrollbar { display: none; }

  /* ================= 通用 ================= */
  .sec {
    display: flex; justify-content: space-between; align-items: baseline;
    margin: 22px 0 12px; font-size: 10.5px; letter-spacing: 1.2px; color: var(--muted);
  }
  .sec .more { letter-spacing: 0; color: var(--accent); font-size: 10.5px; cursor: pointer; }

  .hero { display: flex; align-items: flex-start; justify-content: space-between; padding-top: 14px; }
  .hello {
    font-family: var(--title-font); font-size: 22px; color: var(--fg);
    letter-spacing: .5px; line-height: 1.3;
  }
  .date { margin-top: 6px; font-size: 10.5px; color: var(--muted); }
  .avatar {
    width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
    background: var(--grad); color: #fff; font-size: 12px; font-weight: 600;
    box-shadow: 0 4px 12px rgba(0,0,0,.12);
  }

  /* ================= 工具宫格 ================= */
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
  .cell {
    position: relative; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 7px;
    padding: 14px 4px; cursor: pointer;
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); box-shadow: var(--shadow);
    transition: transform .18s cubic-bezier(.2,.8,.2,1);
  }
  .cell:active { transform: scale(.96); }
  .cell svg { width: 21px; height: 21px; color: var(--accent); }
  .cell .label { font-size: 11px; color: var(--fg); }
  .cell .badge {
    position: absolute; top: 7px; right: 8px;
    min-width: 14px; height: 14px; padding: 0 4px; border-radius: 7px;
    background: var(--accent); color: #fff; font-size: 8.5px;
    display: grid; place-items: center;
  }
  @keyframes jiggle { 0%,100%{transform:rotate(-1.1deg)} 50%{transform:rotate(1.1deg)} }
  .grid.editing .cell { animation: jiggle .3s ease-in-out infinite; }
  .grid.editing .cell:nth-child(2n) { animation-delay: .15s; }
  .minus {
    position: absolute; top: -6px; right: -6px; z-index: 2;
    width: 18px; height: 18px; border-radius: 50%;
    background: #2A2A2A; color: #fff; font-size: 12px;
    display: grid; place-items: center; line-height: 1;
  }
  .cell.add { border-style: dashed; background: transparent; box-shadow: none; }
  .cell.add .plus { font-size: 18px; color: var(--muted); font-weight: 300; }
  .cell.add .label { color: var(--muted); font-size: 10px; }

  /* ================= 群组横滑卡 ================= */
  .groups { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .groups::-webkit-scrollbar { display: none; }
  .gcard {
    position: relative; flex: 0 0 152px; height: 104px; border-radius: var(--radius);
    background: var(--grad); color: #fff; padding: 13px 14px;
    display: flex; flex-direction: column; justify-content: space-between;
    cursor: pointer; overflow: hidden;
    box-shadow: 0 8px 20px rgba(0,0,0,.14);
  }
  .gcard::after {
    content: ''; position: absolute; right: -18px; top: -22px;
    width: 78px; height: 78px; border-radius: 50%;
    background: rgba(255,255,255,.14);
  }
  .gcard .gname { font-size: 13px; font-weight: 600; letter-spacing: .3px; }
  .gcard .gsub { font-size: 9.5px; opacity: .82; margin-top: 3px; }
  .gcard .gfoot { display: flex; align-items: center; justify-content: space-between; }
  .avs { display: flex; }
  .avs .a {
    width: 20px; height: 20px; border-radius: 50%; margin-right: -6px;
    border: 1.5px solid rgba(255,255,255,.9);
    display: grid; place-items: center; font-size: 8px; font-weight: 600;
    background: rgba(255,255,255,.28); backdrop-filter: blur(2px);
  }
  .gcard .pct { font-size: 9.5px; opacity: .9; }

  .gadd {
    flex: 0 0 88px; height: 104px; border-radius: var(--radius);
    border: 1px dashed var(--line); background: transparent;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; color: var(--muted); font-size: 10px; cursor: pointer;
  }
  .gadd span:first-child { font-size: 20px; font-weight: 300; }

  /* ================= 群组详情 ================= */
  .navrow { display: flex; align-items: center; gap: 9px; padding: 12px 0 2px; }
  .back { font-size: 21px; line-height: 1; cursor: pointer; color: var(--fg); padding: 0 3px; }
  .navtitle { font-family: var(--title-font); font-size: 16px; color: var(--fg); }

  .ghead {
    margin-top: 12px; padding: 16px; border-radius: var(--radius);
    background: var(--grad); color: #fff; position: relative; overflow: hidden;
    box-shadow: 0 10px 24px rgba(0,0,0,.16);
  }
  .ghead::after {
    content: ''; position: absolute; right: -28px; bottom: -36px;
    width: 108px; height: 108px; border-radius: 50%; background: rgba(255,255,255,.12);
  }
  .ghead .gt { font-family: var(--title-font); font-size: 18px; letter-spacing: .5px; }
  .ghead .gd { margin-top: 5px; font-size: 10px; opacity: .82; }
  .ghead .gmembers { display: flex; align-items: center; margin-top: 14px; }
  .ghead .gmembers .a {
    width: 24px; height: 24px; border-radius: 50%; margin-right: -7px;
    border: 1.5px solid rgba(255,255,255,.85);
    display: grid; place-items: center; font-size: 9px; font-weight: 600;
    background: rgba(255,255,255,.26);
  }
  .ghead .gmembers .invite {
    margin-left: 14px; font-size: 9.5px; padding: 3px 9px; border-radius: 999px;
    background: rgba(255,255,255,.2); border: 1px solid rgba(255,255,255,.3);
  }

  .ring-card {
    display: flex; align-items: center; gap: 16px; margin-top: 12px;
    padding: 14px 16px; border-radius: var(--radius);
    background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow);
  }
  .ring { position: relative; width: 62px; height: 62px; flex: 0 0 62px; }
  .ring svg { transform: rotate(-90deg); }
  .ring .mid {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-size: 11px; font-weight: 600; color: var(--fg);
  }
  .ring-info .rt { font-size: 12.5px; color: var(--fg); font-weight: 600; }
  .ring-info .rs { margin-top: 4px; font-size: 10px; color: var(--muted); line-height: 1.5; }

  .todo { display: flex; align-items: center; gap: 11px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .todo:last-of-type { border-bottom: none; }
  .check {
    width: 18px; height: 18px; border-radius: 6px; flex: 0 0 18px;
    border: 1.5px solid var(--line); display: grid; place-items: center;
    color: transparent; font-size: 10px;
  }
  .todo.done .check { background: var(--accent); border-color: transparent; color: #fff; }
  .todo .tt { flex: 1; font-size: 12px; color: var(--fg); }
  .todo.done .tt { color: var(--muted); text-decoration: line-through; }
  .todo .who {
    width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center;
    font-size: 8px; font-weight: 600; color: #fff;
  }

  .remind {
    display: flex; align-items: center; gap: 9px; margin-top: 12px;
    padding: 12px 14px; border-radius: var(--radius);
    background: var(--card); border: 1px solid var(--line);
    font-size: 11.5px; color: var(--fg);
  }
  .remind .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
  .remind .rtime { margin-left: auto; font-size: 10px; color: var(--muted); }

  .addbtn {
    margin-top: 14px; width: 100%; padding: 13px; border-radius: var(--radius);
    background: var(--grad); color: #fff; border: none; font-size: 12.5px;
    font-weight: 600; cursor: pointer; letter-spacing: .5px;
  }

  /* ================= 底部 tab ================= */
  .tabbar {
    flex: 0 0 58px; display: flex; align-items: center;
    border-top: 1px solid var(--line); background: var(--bg);
  }
  .tab {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-size: 10px; color: var(--muted); cursor: pointer;
  }
  .tab.on { color: var(--accent); font-weight: 600; }
  .tab svg { width: 19px; height: 19px; }

  /* ================= 工具库抽屉 ================= */
  .mask {
    position: absolute; inset: 0; z-index: 9; background: rgba(26,22,17,.32);
    opacity: 0; pointer-events: none; transition: opacity .26s;
  }
  .mask.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 10;
    background: var(--card); border-radius: 22px 22px 0 0;
    padding: 20px 18px 28px; transform: translateY(112%);
    transition: transform .36s cubic-bezier(.2,.85,.25,1);
    box-shadow: 0 -12px 34px rgba(0,0,0,.16);
  }
  .drawer.open { transform: translateY(0); }
  .dhead { display: flex; justify-content: space-between; align-items: baseline; }
  .dhead .t { font-family: var(--title-font); font-size: 15px; color: var(--fg); }
  .dhead .done { font-size: 11px; color: var(--accent); cursor: pointer; font-weight: 600; }
  .dsub { margin-top: 6px; font-size: 10px; color: var(--muted); }
  .tools { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px 8px; margin-top: 18px; }
  .tool { display: flex; flex-direction: column; align-items: center; gap: 7px; cursor: pointer; }
  .tool .ico {
    width: 42px; height: 42px; border-radius: 13px;
    border: 1px solid var(--line); display: grid; place-items: center;
    color: var(--muted); transition: .2s;
  }
  .tool .ico svg { width: 20px; height: 20px; }
  .tool.on .ico { background: var(--accent); border-color: transparent; color: #fff; }
  .tool .tname { font-size: 10.5px; color: var(--muted); }
  .tool.on .tname { color: var(--fg); }

  .edit {
    margin-top: 3px; padding: 5px 12px; border: 1px solid var(--line);
    border-radius: 999px; background: transparent; color: var(--muted);
    font-size: 10.5px; cursor: pointer;
  }
  .edit.on { background: var(--accent); color: #fff; border-color: transparent; }

  /* ================= 方案说明 ================= */
  .meta { padding: 20px 4px 0; }
  .mname { font-size: 15px; font-weight: 600; }
  .mtag {
    display: inline-block; margin-left: 8px; padding: 2px 8px; border-radius: 999px;
    background: #dcd8d0; color: #57534b; font-size: 10.5px; vertical-align: middle; font-weight: 400;
  }
  .mdesc { margin-top: 10px; font-size: 12px; line-height: 1.75; color: #6f6a62; }
  .swatches { display: flex; gap: 6px; margin-top: 13px; }
  .sw { width: 22px; height: 22px; border-radius: 6px; border: 1px solid rgba(0,0,0,.08); }
  .mfont { margin-top: 10px; font-size: 10.5px; color: #a19b91; }
</style>
</head>
<body>

<header>
  <div class="eyebrow">DAILYUSE · INTERFACE</div>
  <h1>界面方向 · 工具 + 协作群组</h1>
  <p>点群组卡进详情（集体待办 / 成员 / 提醒）；点「编辑」可增减工具。</p>
  <p class="hint">视觉稿；定稿后落到 uni-app 页面</p>
</header>

<main class="stage" id="stage"></main>

<script>
const ICONS = {
  todo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M8 12.5l2.8 2.8L16 9.5"/></svg>',
  note: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5h8.5L19 8v12.5H6z"/><path d="M14 3.5V8h4.5"/><path d="M9 12.5h7M9 16h5"/></svg>',
  wallet: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10.5h18"/><circle cx="16.5" cy="14.5" r="1.1" fill="currentColor" stroke="none"/></svg>',
  calendar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>',
  news: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><path d="M7 9h10M7 12.5h10M7 16h6"/></svg>',
  user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c0-3.8 3-5.8 7-5.8s7 2 7 5.8"/></svg>',
  sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5 5l1.4 1.4M17.6 17.6L19 19M19 5l-1.4 1.4M6.4 17.6L5 19"/></svg>',
  timer: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 10v3.8l2.4 2.4"/><path d="M9 2.5h6"/></svg>',
  water: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s6 6.6 6 11a6 6 0 0 1-12 0c0-4.4 6-11 6-11z"/></svg>',
  tool: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>',
  group: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8.5" r="3"/><path d="M3 19c0-3.2 2.6-5 6-5s6 1.8 6 5"/><path d="M16 6.2a3 3 0 0 1 0 5.6M17.5 14.4c2.2.6 3.5 2.2 3.5 4.6"/></svg>',
  bell: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10a6 6 0 0 1 12 0c0 4 1.5 5.5 1.5 5.5H4.5S6 14 6 10z"/><path d="M10 19a2 2 0 0 0 4 0"/></svg>'
};

const TOOLS = [
  { id: 'todo', name: '待办', icon: 'todo' },
  { id: 'note', name: '便签', icon: 'note' },
  { id: 'wallet', name: '记账', icon: 'wallet' },
  { id: 'calendar', name: '倒数日', icon: 'calendar' },
  { id: 'news', name: '资讯', icon: 'news' },
  { id: 'sun', name: '天气', icon: 'sun' },
  { id: 'timer', name: '番茄钟', icon: 'timer' },
  { id: 'water', name: '喝水', icon: 'water' }
];

const GROUPS = [
  {
    id: 'family', name: '一家人', sub: '本周 5 / 8 完成', pct: '62%',
    members: [{ n: '我', c: '#F2703C' }, { n: '妈', c: '#4C9AFF' }, { n: '爸', c: '#34C759' }],
    todos: [
      { t: '交水电费', done: true, who: '我', c: '#F2703C' },
      { t: '买周末的菜', done: true, who: '妈', c: '#4C9AFF' },
      { t: '给奶奶打电话', done: false, who: '我', c: '#F2703C' },
      { t: '预约体检', done: false, who: '爸', c: '#34C759' }
    ]
  },
  {
    id: 'camp', name: '周末露营', sub: '周六出发前', pct: '40%',
    members: [{ n: '我', c: '#F2703C' }, { n: '阿哲', c: '#AF52DE' }, { n: '小林', c: '#FF9500' }],
    todos: [
      { t: '订营地', done: true, who: '阿哲', c: '#AF52DE' },
      { t: '买炭火', done: false, who: '我', c: '#F2703C' },
      { t: '确认天气', done: false, who: '小林', c: '#FF9500' }
    ]
  }
];

const THEMES = [
  {
    id: 'cream', name: 'D · 奶油橙', tag: '生活感',
    desc: '奶油底 + 珊瑚橙渐变。群组卡用整块色，有温度、不冷。适合「家庭 / 朋友一起用」的场景，用户第一眼不会觉得是工具。',
    colors: ['#FDF8F3', '#2B2320', '#F2703C', '#F0E5DA'],
    font: '全苹方 · 22px 圆角 · 柔和投影'
  },
  {
    id: 'azure', name: 'E · 青黛', tag: '现代效率',
    desc: '冷白底 + 蓝紫渐变，卡片刻度清晰、阴影轻。最像成熟效率产品，协作感和「靠谱」感最强。',
    colors: ['#F4F6FB', '#16203A', '#3B5BDB', '#E6EAF4'],
    font: '全苹方 · 20px 圆角 · 轻阴影'
  },
  {
    id: 'ink', name: 'F · 墨韵', tag: '东方现代',
    desc: '米白 + 墨绿 + 金色点缀，衬线标题。保留你偏好的东方气质，但用渐变和色块把「素」补上了。',
    colors: ['#F3F1EA', '#1E2B24', '#2C4A3B', '#C9A227'],
    font: '宋体标题 / 苹方正文 · 16px 圆角'
  }
];

const state = {};

function avatarStack(members) {
  return members.map(m => `<span class="a" style="background:${m.c}">${m.n}</span>`).join('');
}

function renderHome(t) {
  const st = state[t.id];
  const selected = TOOLS.filter(x => st.selected.includes(x.id));

  let cells = selected.map(x => `
    <div class="cell" ${st.editing ? `data-act="remove" data-id="${t.id}" data-tool="${x.id}"` : ''}>
      ${st.editing ? '<span class="minus">–</span>' : ''}
      ${ICONS[x.icon]}<span class="label">${x.name}</span>
      ${x.id === 'todo' ? '<span class="badge">3</span>' : ''}
    </div>`).join('');

  if (st.editing) {
    cells += `<div class="cell add" data-act="open-drawer" data-id="${t.id}">
      <span class="plus">＋</span><span class="label">添加工具</span></div>`;
  }

  const gcards = GROUPS.map(g => `
    <div class="gcard" data-act="open-group" data-id="${t.id}" data-group="${g.id}">
      <div>
        <div class="gname">${g.name}</div>
        <div class="gsub">${g.sub}</div>
      </div>
      <div class="gfoot">
        <div class="avs">${avatarStack(g.members)}</div>
        <span class="pct">${g.pct}</span>
      </div>
    </div>`).join('');

  return `
    <div class="hero">
      <div>
        <div class="hello">晚上好</div>
        <div class="date">10 月 22 日 · 周四</div>
      </div>
      ${st.editing ? `<button class="edit on" data-act="edit" data-id="${t.id}">完成</button>`
                  : `<button class="edit" data-act="edit" data-id="${t.id}">编辑</button>`}
    </div>

    <div class="sec"><span>我的工具 · ${selected.length}</span><span class="more">全部</span></div>
    <div class="grid ${st.editing ? 'editing' : ''}">${cells}</div>

    <div class="sec"><span>协作群组</span><span class="more">管理</span></div>
    <div class="groups">
      ${gcards}
      <div class="gadd"><span>＋</span><span>创建群组</span></div>
    </div>

    <div class="remind" style="margin-top:16px">
      <span class="dot"></span>
      <span>今晚 20:00 · 家庭群有 2 件事待办</span>
      <span class="rtime">提醒</span>
    </div>`;
}

function renderGroup(t, groupId) {
  const g = GROUPS.find(x => x.id === groupId) || GROUPS[0];
  const done = g.todos.filter(x => x.done).length;
  const total = g.todos.length;
  const pct = Math.round(done / total * 100);
  const dash = 2 * Math.PI * 26;
  const off = dash * (1 - pct / 100);

  const todos = g.todos.map(x => `
    <div class="todo ${x.done ? 'done' : ''}">
      <span class="check">✓</span>
      <span class="tt">${x.t}</span>
      <span class="who" style="background:${x.c}">${x.who}</span>
    </div>`).join('');

  return `
    <div class="navrow">
      <span class="back" data-act="back" data-id="${t.id}">‹</span>
      <span class="navtitle">${g.name}</span>
    </div>

    <div class="ghead">
      <div class="gt">${g.name}</div>
      <div class="gd">3 位成员 · 本周集体待办 ${total} 件</div>
      <div class="gmembers">
        ${avatarStack(g.members)}
        <span class="invite">＋ 邀请</span>
      </div>
    </div>

    <div class="ring-card">
      <div class="ring">
        <svg width="62" height="62" viewBox="0 0 62 62">
          <circle cx="31" cy="31" r="26" fill="none" stroke="var(--line)" stroke-width="6"/>
          <circle cx="31" cy="31" r="26" fill="none" stroke="var(--accent)" stroke-width="6"
                  stroke-linecap="round" stroke-dasharray="${dash}" stroke-dashoffset="${off}"/>
        </svg>
        <div class="mid">${pct}%</div>
      </div>
      <div class="ring-info">
        <div class="rt">本周已完成 ${done} / ${total}</div>
        <div class="rs">还差 ${total - done} 件，周六前完成即可</div>
      </div>
    </div>

    <div class="sec"><span>集体待办</span><span class="more">＋ 添加</span></div>
    ${todos}

    <div class="remind">
      ${ICONS.bell}
      <span>每天 20:00 提醒未完成事项</span>
      <span class="rtime">已开启</span>
    </div>

    <button class="addbtn" data-act="noop" data-id="${t.id}">＋ 添加集体待办</button>`;
}

function render(id) {
  const st = state[id];
  const screen = document.getElementById('screen-' + id);
  const tabbar = document.getElementById('tab-' + id);
  screen.innerHTML = st.view === 'group' ? renderGroup(THEMES.find(t => t.id === id), st.group)
                                        : renderHome(THEMES.find(t => t.id === id));

  const tabs = [
    { k: 'home', label: '工具', icon: ICONS.tool },
    { k: 'group', label: '群组', icon: ICONS.group },
    { k: 'mine', label: '我的', icon: ICONS.user }
  ];
  tabbar.innerHTML = tabs.map(x => `
    <div class="tab ${st.view === x.k ? 'on' : ''}" data-act="tab" data-id="${id}" data-tab="${x.k}">
      ${x.icon}<span>${x.label}</span>
    </div>`).join('');

  const toolsBox = document.getElementById('tools-' + id);
  toolsBox.innerHTML = TOOLS.map(x => `
    <div class="tool ${st.selected.includes(x.id) ? 'on' : ''}" data-act="toggle" data-id="${id}" data-tool="${x.id}">
      <span class="ico">${ICONS[x.icon]}</span><span class="tname">${x.name}</span>
    </div>`).join('');

  document.getElementById('drawer-' + id).classList.toggle('open', st.drawer);
  document.getElementById('mask-' + id).classList.toggle('open', st.drawer);
}

function renderPhone(t) {
  const swatches = t.colors.map(c => `<span class="sw" style="background:${c}"></span>`).join('');
  return `
  <section class="wrap">
    <div class="phone" data-theme="${t.id}">
      <div class="status"><span>9:41</span><span>●●●●</span></div>
      <div class="screen" id="screen-${t.id}"></div>
      <div class="tabbar" id="tab-${t.id}"></div>

      <div class="mask" data-act="close-drawer" data-id="${t.id}" id="mask-${t.id}"></div>
      <div class="drawer" id="drawer-${t.id}">
        <div class="dhead">
          <span class="t">选择工具</span>
          <span class="done" data-act="close-drawer" data-id="${t.id}">完成</span>
        </div>
        <div class="dsub">点一下加入或移除，工具栏实时生效</div>
        <div class="tools" id="tools-${t.id}"></div>
      </div>
    </div>

    <div class="meta">
      <div class="mname">${t.name}<span class="mtag">${t.tag}</span></div>
      <p class="mdesc">${t.desc}</p>
      <div class="swatches">${swatches}</div>
      <div class="mfont">${t.font}</div>
    </div>
  </section>`;
}

function toggleTool(id, toolId) {
  const st = state[id];
  if (st.selected.includes(toolId)) {
    if (st.selected.length <= 1) return;
    st.selected = st.selected.filter(x => x !== toolId);
  } else {
    st.selected.push(toolId);
  }
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, id = el.dataset.id, tool = el.dataset.tool, tab = el.dataset.tab;
  if (!id || !state[id]) return;
  const st = state[id];

  if (act === 'edit') { st.editing = !st.editing; if (!st.editing) st.drawer = false; }
  else if (act === 'open-drawer') { st.drawer = true; }
  else if (act === 'close-drawer') { st.drawer = false; }
  else if (act === 'toggle') { toggleTool(id, tool); }
  else if (act === 'remove') {
    if (st.selected.length <= 1) return;
    st.selected = st.selected.filter(x => x !== tool);
  }
  else if (act === 'open-group') { st.view = 'group'; st.group = el.dataset.group; st.editing = false; }
  else if (act === 'back') { st.view = 'home'; }
  else if (act === 'tab') {
    if (tab === 'group') { st.view = 'group'; st.group = 'family'; }
    else if (tab === 'home') { st.view = 'home'; }
    else { st.view = 'home'; }
  }
  else if (act === 'noop') { /* demo 占位 */ }

  render(id);
});

THEMES.forEach(t => {
  state[t.id] = { view: 'home', group: 'family', selected: ['todo', 'note', 'wallet', 'news'], editing: false, drawer: false };
});
document.getElementById('stage').innerHTML = THEMES.map(renderPhone).join('');
THEMES.forEach(t => render(t.id));
</script>
</body>
</html>
