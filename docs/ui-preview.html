<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dailyuse · 界面方向与自定义工具栏</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #E7E4DE;
    color: #1a1a1a;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  header { padding: 48px 24px 4px; text-align: center; }
  .eyebrow {
    font-size: 10px; letter-spacing: 3.4px; color: #98938a;
    text-transform: uppercase; margin-bottom: 12px;
  }
  header h1 { font-size: 25px; font-weight: 600; letter-spacing: .6px; }
  header p { margin-top: 10px; font-size: 12.5px; color: #6f6a62; line-height: 1.7; }
  header .hint { margin-top: 4px; font-size: 11px; color: #a19b91; }

  .stage {
    display: flex; gap: 40px; justify-content: center; flex-wrap: wrap;
    padding: 40px 24px 80px; align-items: flex-start;
  }
  .wrap { width: 320px; }

  /* ================= 手机外壳 ================= */
  .phone {
    position: relative; width: 320px; height: 680px;
    border: 9px solid #17181a; border-radius: 44px; overflow: hidden;
    display: flex; flex-direction: column;
    background: var(--bg);
    box-shadow: 0 22px 48px rgba(40,35,28,.18), 0 2px 6px rgba(40,35,28,.08);
    --bg:#fff; --fg:#111; --muted:#8a8a8a; --accent:#4F6EF7;
    --line:#e8e8e8; --card:#fff; --radius:16px; --shadow:none; --tint:rgba(79,110,247,.09);
    --title-font:"PingFang SC", sans-serif;
  }

  /* A · 素纸 */
  .phone[data-theme="paper"] {
    --bg:#F4EFE4; --fg:#1A1714; --muted:#8B8172; --accent:#B33A2B;
    --line:#E4DBC9; --card:#FBF7EE; --radius:6px; --shadow:none;
    --tint:rgba(179,58,43,.07);
    --title-font:"Songti SC","STSong","SimSun",serif;
  }
  /* B · 白瓷 */
  .phone[data-theme="porcelain"] {
    --bg:#FBFBFD; --fg:#111827; --muted:#98A0AC; --accent:#4F6EF7;
    --line:#E9EBF0; --card:#FFFFFF; --radius:18px;
    --shadow:0 2px 10px rgba(17,24,39,.05);
    --tint:rgba(79,110,247,.08);
  }
  /* C · 墨绿 */
  .phone[data-theme="ink"] {
    --bg:#F7F6F0; --fg:#15241D; --muted:#8A8F84; --accent:#1E3D31;
    --line:#E2DFD2; --card:#FFFFFF; --radius:12px; --shadow:none;
    --tint:rgba(30,61,49,.07);
    --title-font:"Songti SC","STSong",serif;
  }

  /* ================= 状态栏 ================= */
  .status {
    flex: 0 0 30px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px; font-size: 10px; color: var(--fg); opacity: .7;
  }

  /* ================= 屏幕 ================= */
  .screen {
    flex: 1; overflow-y: auto; padding: 0 18px;
    scrollbar-width: none;
  }
  .screen::-webkit-scrollbar { display: none; }

  .hero { display: flex; align-items: flex-start; justify-content: space-between; padding-top: 14px; }
  .hello {
    font-family: var(--title-font); font-size: 21px; color: var(--fg);
    letter-spacing: .6px; line-height: 1.3;
  }
  .date { margin-top: 6px; font-size: 10.5px; color: var(--muted); letter-spacing: .3px; }
  .edit {
    margin-top: 3px; padding: 5px 12px; border: 1px solid var(--line);
    border-radius: 999px; background: transparent; color: var(--muted);
    font-size: 10.5px; cursor: pointer; transition: .2s;
  }
  .edit:active { transform: scale(.96); }
  .edit.on { background: var(--accent); color: #fff; border-color: transparent; }

  .sec {
    display: flex; justify-content: space-between; align-items: baseline;
    margin: 26px 0 12px; font-size: 10.5px; letter-spacing: 1.3px; color: var(--muted);
  }
  .sec .cnt { letter-spacing: 0; color: var(--accent); }

  /* ================= 工具宫格 ================= */
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

  .cell {
    position: relative; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 8px;
    padding: 15px 4px; cursor: pointer;
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); box-shadow: var(--shadow);
    transition: transform .18s cubic-bezier(.2,.8,.2,1), background .2s;
  }
  .cell:active { transform: scale(.96); }
  .cell svg { width: 22px; height: 22px; color: var(--accent); }
  .cell .label { font-size: 11.5px; color: var(--fg); letter-spacing: .2px; }
  .cell .badge {
    position: absolute; top: 8px; right: 9px;
    min-width: 15px; height: 15px; padding: 0 4px; border-radius: 8px;
    background: var(--accent); color: #fff; font-size: 9px;
    display: grid; place-items: center;
  }

  @keyframes jiggle {
    0%, 100% { transform: rotate(-1.1deg); }
    50% { transform: rotate(1.1deg); }
  }
  .grid.editing .cell { animation: jiggle .3s ease-in-out infinite; }
  .grid.editing .cell:nth-child(2n) { animation-delay: .15s; }

  .minus {
    position: absolute; top: -6px; right: -6px; z-index: 2;
    width: 18px; height: 18px; border-radius: 50%;
    background: #2A2A2A; color: #fff; font-size: 12px;
    display: grid; place-items: center; line-height: 1;
    box-shadow: 0 2px 6px rgba(0,0,0,.2);
  }

  .cell.add {
    border-style: dashed; background: transparent;
    box-shadow: none; color: var(--muted);
  }
  .cell.add .plus { font-size: 19px; line-height: 1; color: var(--muted); font-weight: 300; }
  .cell.add .label { color: var(--muted); font-size: 10.5px; }

  /* ================= 今日概览 ================= */
  .sum {
    display: flex; justify-content: space-between; margin-top: 20px;
    padding: 14px 16px; border: 1px solid var(--line);
    border-radius: var(--radius); background: var(--card); box-shadow: var(--shadow);
  }
  .sum .item { display: flex; flex-direction: column; gap: 5px; }
  .sum .k { font-size: 9.5px; color: var(--muted); letter-spacing: .4px; }
  .sum .v {
    font-family: var(--title-font); font-size: 15px; color: var(--fg);
    font-variant-numeric: tabular-nums;
  }

  /* ================= 底部 tab ================= */
  .tabbar {
    flex: 0 0 58px; display: flex; align-items: center;
    border-top: 1px solid var(--line); background: var(--bg);
  }
  .tab {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-size: 10px; color: var(--muted); cursor: pointer;
  }
  .tab.on { color: var(--accent); font-weight: 600; }
  .tab svg { width: 19px; height: 19px; }

  /* ================= 工具库抽屉 ================= */
  .mask {
    position: absolute; inset: 0; z-index: 9; background: rgba(26,22,17,.3);
    opacity: 0; pointer-events: none; transition: opacity .26s;
  }
  .mask.open { opacity: 1; pointer-events: auto; }

  .drawer {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 10;
    background: var(--card); border-radius: 22px 22px 0 0;
    padding: 20px 18px 28px;
    transform: translateY(112%);
    transition: transform .36s cubic-bezier(.2,.85,.25,1);
    box-shadow: 0 -12px 34px rgba(0,0,0,.16);
  }
  .drawer.open { transform: translateY(0); }

  .dhead { display: flex; justify-content: space-between; align-items: baseline; }
  .dhead .t {
    font-family: var(--title-font); font-size: 15px; color: var(--fg); letter-spacing: .4px;
  }
  .dhead .done {
    font-size: 11px; color: var(--accent); cursor: pointer; font-weight: 600;
  }
  .dsub { margin-top: 6px; font-size: 10px; color: var(--muted); }

  .tools { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px 8px; margin-top: 18px; }
  .tool { display: flex; flex-direction: column; align-items: center; gap: 7px; cursor: pointer; }
  .tool .ico {
    width: 42px; height: 42px; border-radius: 13px;
    border: 1px solid var(--line); display: grid; place-items: center;
    color: var(--muted); background: transparent; transition: .2s;
  }
  .tool .ico svg { width: 20px; height: 20px; }
  .tool.on .ico { background: var(--accent); border-color: transparent; color: #fff; }
  .tool .tname { font-size: 10.5px; color: var(--muted); }
  .tool.on .tname { color: var(--fg); }

  /* ================= 方案说明 ================= */
  .meta { padding: 20px 4px 0; }
  .mname { font-size: 15px; font-weight: 600; }
  .mtag {
    display: inline-block; margin-left: 8px; padding: 2px 8px; border-radius: 999px;
    background: #dcd8d0; color: #57534b; font-size: 10.5px; vertical-align: middle;
    font-weight: 400;
  }
  .mdesc { margin-top: 10px; font-size: 12px; line-height: 1.75; color: #6f6a62; }
  .swatches { display: flex; gap: 6px; margin-top: 13px; }
  .sw { width: 22px; height: 22px; border-radius: 6px; border: 1px solid rgba(0,0,0,.08); }
  .mfont { margin-top: 10px; font-size: 10.5px; color: #a19b91; }
</style>
</head>
<body>

<header>
  <div class="eyebrow">DAILYUSE · INTERFACE</div>
  <h1>界面方向 · 自定义工具栏</h1>
  <p>点「编辑」进入编辑态 → 点「＋」从工具库增减 → 点「完成」退出。三个方向都可操作。</p>
  <p class="hint">视觉稿；定稿后落到 uni-app 页面</p>
</header>

<main class="stage" id="stage"></main>

<script>
const ICONS = {
  todo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M8 12.5l2.8 2.8L16 9.5"/></svg>',
  note: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5h8.5L19 8v12.5H6z"/><path d="M14 3.5V8h4.5"/><path d="M9 12.5h7M9 16h5"/></svg>',
  wallet: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10.5h18"/><circle cx="16.5" cy="14.5" r="1.1" fill="currentColor" stroke="none"/></svg>',
  calendar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>',
  news: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><path d="M7 9h10M7 12.5h10M7 16h6"/></svg>',
  user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c0-3.8 3-5.8 7-5.8s7 2 7 5.8"/></svg>',
  sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5 5l1.4 1.4M17.6 17.6L19 19M19 5l-1.4 1.4M6.4 17.6L5 19"/></svg>',
  timer: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 10v3.8l2.4 2.4"/><path d="M9 2.5h6"/></svg>',
  water: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s6 6.6 6 11a6 6 0 0 1-12 0c0-4.4 6-11 6-11z"/></svg>',
  tool: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>'
};

const TOOLS = [
  { id: 'todo', name: '待办', icon: 'todo' },
  { id: 'note', name: '便签', icon: 'note' },
  { id: 'wallet', name: '记账', icon: 'wallet' },
  { id: 'calendar', name: '倒数日', icon: 'calendar' },
  { id: 'news', name: '资讯', icon: 'news' },
  { id: 'sun', name: '天气', icon: 'sun' },
  { id: 'timer', name: '番茄钟', icon: 'timer' },
  { id: 'water', name: '喝水', icon: 'water' }
];

const THEMES = [
  {
    id: 'paper', name: 'A · 素纸', tag: '中式极简',
    desc: '宣纸底、宋体标题、朱砂点睛。工具像摆在一张纸上，编辑态的抖动也克制。辨识度最高，适合做成「有记忆点」的日常小册子。',
    colors: ['#F4EFE4', '#1A1714', '#B33A2B', '#E4DBC9'],
    font: '宋体标题 / 苹方正文 · 6px 直角卡片 · 细线框',
    init: ['todo', 'note', 'wallet', 'news']
  },
  {
    id: 'porcelain', name: 'B · 白瓷', tag: '清爽效率',
    desc: '白底大圆角、蓝色主色、柔和阴影。最接近主流小程序，用户零学习成本，适合快速验证、不想在教育用户上花成本。',
    colors: ['#FBFBFD', '#111827', '#4F6EF7', '#E9EBF0'],
    font: '全苹方 · 18px 圆角 · 轻阴影',
    init: ['todo', 'note', 'wallet', 'calendar', 'news']
  },
  {
    id: 'ink', name: 'C · 墨绿', tag: '沉稳工具',
    desc: '米白配深墨绿，衬线标题。比 A 克制、比 B 有工具感，适合「每天都要打开」的长期使用场景。',
    colors: ['#F7F6F0', '#15241D', '#1E3D31', '#E2DFD2'],
    font: '宋体标题 / 苹方正文 · 12px 圆角 · 细线框',
    init: ['todo', 'wallet', 'news']
  }
];

const state = {};

function renderPhone(t) {
  const swatches = t.colors.map(c => `<span class="sw" style="background:${c}"></span>`).join('');
  return `
  <section class="wrap">
    <div class="phone" data-theme="${t.id}">
      <div class="status"><span>9:41</span><span>●●●●</span></div>

      <div class="screen">
        <div class="hero">
          <div>
            <div class="hello">晚上好</div>
            <div class="date">10 月 22 日 · 周四</div>
          </div>
          <button class="edit" data-act="edit" data-id="${t.id}" id="edit-${t.id}">编辑</button>
        </div>

        <div class="sec">
          <span>我的工具</span>
          <span class="cnt" id="cnt-${t.id}">4 个</span>
        </div>

        <div class="grid" id="grid-${t.id}"></div>

        <div class="sum">
          <div class="item"><span class="k">今日待办</span><span class="v">3</span></div>
          <div class="item"><span class="k">本月支出</span><span class="v">¥1,280</span></div>
          <div class="item"><span class="k">最近倒数</span><span class="v">7 天</span></div>
        </div>
      </div>

      <div class="tabbar">
        <div class="tab on">${ICONS.tool}<span>工具</span></div>
        <div class="tab">${ICONS.user}<span>我的</span></div>
      </div>

      <div class="mask" data-act="close-drawer" data-id="${t.id}" id="mask-${t.id}"></div>
      <div class="drawer" id="drawer-${t.id}">
        <div class="dhead">
          <span class="t">选择工具</span>
          <span class="done" data-act="close-drawer" data-id="${t.id}">完成</span>
        </div>
        <div class="dsub">点一下加入或移除，工具栏实时生效</div>
        <div class="tools" id="tools-${t.id}"></div>
      </div>
    </div>

    <div class="meta">
      <div class="mname">${t.name}<span class="mtag">${t.tag}</span></div>
      <p class="mdesc">${t.desc}</p>
      <div class="swatches">${swatches}</div>
      <div class="mfont">${t.font}</div>
    </div>
  </section>`;
}

function render(id) {
  const st = state[id];
  const selected = TOOLS.filter(t => st.selected.includes(t.id));
  const grid = document.getElementById('grid-' + id);
  const cnt = document.getElementById('cnt-' + id);
  const editBtn = document.getElementById('edit-' + id);
  const toolsBox = document.getElementById('tools-' + id);
  const drawer = document.getElementById('drawer-' + id);
  const mask = document.getElementById('mask-' + id);

  let html = selected.map(t => `
    <div class="cell" ${st.editing ? `data-act="remove" data-id="${id}" data-tool="${t.id}"` : ''}>
      ${st.editing ? '<span class="minus">–</span>' : ''}
      ${ICONS[t.icon]}
      <span class="label">${t.name}</span>
    </div>`).join('');

  if (st.editing) {
    html += `<div class="cell add" data-act="open-drawer" data-id="${id}">
      <span class="plus">＋</span><span class="label">添加工具</span>
    </div>`;
  }
  grid.innerHTML = html;
  grid.classList.toggle('editing', st.editing);

  cnt.textContent = selected.length + ' 个';
  editBtn.textContent = st.editing ? '完成' : '编辑';
  editBtn.classList.toggle('on', st.editing);

  toolsBox.innerHTML = TOOLS.map(t => `
    <div class="tool ${st.selected.includes(t.id) ? 'on' : ''}" data-act="toggle" data-id="${id}" data-tool="${t.id}">
      <span class="ico">${ICONS[t.icon]}</span>
      <span class="tname">${t.name}</span>
    </div>`).join('');

  drawer.classList.toggle('open', st.drawer);
  mask.classList.toggle('open', st.drawer);
}

function toggleTool(id, toolId) {
  const st = state[id];
  if (st.selected.includes(toolId)) {
    if (st.selected.length <= 1) return; // 至少保留一个
    st.selected = st.selected.filter(x => x !== toolId);
  } else {
    st.selected.push(toolId);
  }
  render(id);
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  const id = el.dataset.id;
  const tool = el.dataset.tool;
  if (!id || !state[id]) return;
  const st = state[id];

  if (act === 'edit') {
    st.editing = !st.editing;
    if (!st.editing) st.drawer = false;
  } else if (act === 'open-drawer') {
    st.drawer = true;
  } else if (act === 'close-drawer') {
    st.drawer = false;
  } else if (act === 'toggle') {
    toggleTool(id, tool);
    return;
  } else if (act === 'remove') {
    if (st.selected.length <= 1) return;
    st.selected = st.selected.filter(x => x !== tool);
  }
  render(id);
});

// 初始化
THEMES.forEach(t => { state[t.id] = { selected: [...t.init], editing: false, drawer: false }; });
document.getElementById('stage').innerHTML = THEMES.map(renderPhone).join('');
THEMES.forEach(t => render(t.id));
</script>
</body>
</html>
