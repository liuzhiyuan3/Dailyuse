<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dailyuse · 首页与美食记录 · 三个方向</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #E9E6E0; color: #1a1a1a; min-height: 100vh;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header { padding: 44px 24px 4px; text-align: center; }
  .eyebrow { font-size: 10px; letter-spacing: 3.2px; color: #98938a; text-transform: uppercase; margin-bottom: 12px; }
  header h1 { font-size: 24px; font-weight: 600; letter-spacing: .5px; }
  header p { margin-top: 10px; font-size: 12.5px; color: #6f6a62; line-height: 1.7; }
  header .hint { margin-top: 4px; font-size: 11px; color: #a19b91; }

  .stage { display: flex; gap: 38px; justify-content: center; flex-wrap: wrap; padding: 36px 24px 80px; align-items: flex-start; }
  .wrap { width: 320px; }

  .phone {
    position: relative; width: 320px; height: 700px;
    border: 9px solid #17181a; border-radius: 44px; overflow: hidden;
    display: flex; flex-direction: column; background: var(--bg);
    box-shadow: 0 22px 48px rgba(40,35,28,.18), 0 2px 6px rgba(40,35,28,.08);
    --bg:#F4F6FB; --fg:#16203A; --muted:#8A94AB; --accent:#3B5BDB;
    --line:#E6EAF4; --card:#FFFFFF; --radius:16px;
    --shadow:0 6px 20px rgba(59,91,219,.08);
    --grad: linear-gradient(135deg,#5C7CFA,#3B5BDB);
  }
  .phone[data-theme="warm"] {
    --bg:#FDF7F2; --fg:#2A211C; --muted:#9C8C80; --accent:#E8590C;
    --line:#F1E3D8; --card:#FFFFFF; --radius:16px;
    --shadow:0 6px 20px rgba(232,89,12,.08);
    --grad: linear-gradient(135deg,#FFA94D,#E8590C);
  }
  .phone[data-theme="plain"] {
    --bg:#FAFAFA; --fg:#1B1B1B; --muted:#8C8C8C; --accent:#1F2937;
    --line:#EAEAEA; --card:#FFFFFF; --radius:12px;
    --shadow:0 4px 16px rgba(0,0,0,.05);
    --grad: linear-gradient(135deg,#4B5563,#111827);
  }

  /* 状态栏 + 胶囊占位（关键：页面内容从胶囊下方开始） */
  .status {
    flex: 0 0 28px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px; font-size: 10px; color: var(--fg); opacity: .7;
  }
  .capsule {
    position: absolute; top: 34px; right: 14px; z-index: 6;
    height: 30px; padding: 0 10px; border-radius: 999px;
    background: rgba(255,255,255,.9); border: 1px solid rgba(0,0,0,.08);
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: #333;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
  }
  .navspace { flex: 0 0 46px; }

  .screen { flex: 1; overflow-y: auto; padding: 0 18px 10px; scrollbar-width: none; }
  .screen::-webkit-scrollbar { display: none; }
  .hidden { display: none; }

  .hero { display: flex; align-items: flex-start; justify-content: space-between; padding-top: 4px; }
  .hello { font-size: 21px; font-weight: 600; letter-spacing: .4px; }
  .date { margin-top: 5px; font-size: 10.5px; color: var(--muted); }
  .edit {
    padding: 5px 12px; border: 1px solid var(--line); border-radius: 999px;
    font-size: 10.5px; color: var(--muted); background: var(--card);
  }

  .sec { display: flex; justify-content: space-between; align-items: baseline; margin: 16px 0 9px; font-size: 10px; letter-spacing: 1.1px; color: var(--muted); }
  .sec .more { letter-spacing: 0; color: var(--accent); }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
  .cell {
    padding: 12px 4px; background: var(--card);
    border: 1px solid var(--line); border-radius: 14px;
    box-shadow: var(--shadow);
    display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  .cell svg { width: 20px; height: 20px; color: var(--accent); }
  .cell .label { font-size: 10.5px; color: var(--fg); }

  .summary {
    display: flex; align-items: center; padding: 11px 4px;
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); box-shadow: var(--shadow);
  }
  .sitem { flex: 1; text-align: center; }
  .k { font-size: 9px; color: var(--muted); }
  .v { margin-top: 4px; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .unit { font-size: 9px; color: var(--muted); font-weight: 400; }
  .sdiv { width: 1px; height: 24px; background: var(--line); }

  /* 美食卡 */
  .foodcard {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 14px; border-radius: var(--radius);
    background: var(--grad); color: #fff;
    box-shadow: 0 8px 20px rgba(0,0,0,.14);
  }
  .foodcard .fleft { flex: 1; min-width: 0; }
  .foodcard .ft { font-size: 12.5px; font-weight: 600; }
  .foodcard .fs { margin-top: 4px; font-size: 10px; opacity: .85; }
  .foodcard .fright { text-align: right; font-size: 18px; font-weight: 600; line-height: 1; }
  .foodcard .fright small { display: block; margin-top: 4px; font-size: 9px; font-weight: 400; opacity: .8; }

  .groups { display: flex; gap: 9px; overflow-x: auto; padding-bottom: 2px; }
  .gcard {
    flex: 0 0 148px; height: 88px; padding: 11px 12px; border-radius: var(--radius);
    background: var(--card); border: 1px solid var(--line);
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .gname { font-size: 12.5px; font-weight: 600; }
  .gsub { font-size: 9.5px; color: var(--muted); }
  .gbar { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
  .gfill { height: 100%; background: var(--grad); border-radius: 2px; }

  .feed { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 2px 13px; }
  .fitem { display: flex; gap: 9px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .fitem:last-child { border-bottom: none; }
  .fdot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-top: 5px; flex: 0 0 6px; }
  .ftxt { flex: 1; font-size: 11px; line-height: 1.5; }
  .ftime { font-size: 9.5px; color: var(--muted); }

  /* 美食页 */
  .fhead { padding-top: 2px; }
  .ftitle { font-size: 20px; font-weight: 600; }
  .fsub { margin-top: 5px; font-size: 10.5px; color: var(--muted); }
  .seg { display: flex; gap: 7px; margin: 14px 0 10px; }
  .s {
    padding: 6px 14px; border-radius: 999px; font-size: 11px;
    color: var(--muted); background: var(--card); border: 1px solid var(--line);
  }
  .s.on { background: var(--accent); color: #fff; border-color: transparent; }
  .inputbar { display: flex; gap: 8px; }
  .ipt {
    flex: 1; height: 40px; padding: 0 15px; border-radius: 999px;
    background: var(--card); border: 1px solid var(--line);
    font-size: 12px; color: var(--muted); display: flex; align-items: center;
  }
  .plus {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--grad); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 19px;
  }
  .flist { margin-top: 12px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 0 13px; }
  .frow { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .frow:last-child { border-bottom: none; }
  .frow .l { flex: 1; }
  .frow .c { font-size: 12.5px; }
  .frow .t { display: block; margin-top: 3px; font-size: 9.5px; color: var(--muted); }
  .eaten { padding: 4px 9px; border-radius: 999px; background: rgba(59,91,219,.1); color: var(--accent); font-size: 9.5px; font-weight: 600; }
  .phone[data-theme="warm"] .eaten { background: rgba(232,89,12,.1); }
  .phone[data-theme="plain"] .eaten { background: rgba(31,41,55,.08); }
  .del { font-size: 10px; color: var(--muted); }

  .tabbar { flex: 0 0 56px; display: flex; align-items: center; border-top: 1px solid var(--line); background: var(--bg); }
  .tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 9.5px; color: var(--muted); }
  .tab.on { color: var(--accent); font-weight: 600; }
  .tab svg { width: 18px; height: 18px; }

  .back { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); margin-top: 2px; }

  .meta { padding: 18px 4px 0; }
  .mname { font-size: 15px; font-weight: 600; }
  .mtag { display: inline-block; margin-left: 8px; padding: 2px 8px; border-radius: 999px; background: #dcd8d0; color: #57534b; font-size: 10.5px; font-weight: 400; }
  .mdesc { margin-top: 9px; font-size: 12px; line-height: 1.7; color: #6f6a62; }
  .swatches { display: flex; gap: 6px; margin-top: 12px; }
  .sw { width: 22px; height: 22px; border-radius: 6px; border: 1px solid rgba(0,0,0,.08); }
</style>
</head>
<body>

<header>
  <div class="eyebrow">DAILYUSE · HOME + FOOD</div>
  <h1>首页与美食记录 · 三个方向</h1>
  <p>点美食卡或底部「美食」进入记录页；注意右上角「编辑」已在胶囊下方，不再被遮挡。</p>
  <p class="hint">视觉稿，非最终代码</p>
</header>

<main class="stage" id="stage"></main>

<script>
const I = {
  todo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M8 12.5l2.8 2.8L16 9.5"/></svg>',
  note: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5h8.5L19 8v12.5H6z"/><path d="M14 3.5V8h4.5"/><path d="M9 12.5h7M9 16h5"/></svg>',
  wallet: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10.5h18"/></svg>',
  calendar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>',
  news: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><path d="M7 9h10M7 12.5h10M7 16h6"/></svg>',
  food: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11h16v4a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z"/><path d="M8 7h8"/><path d="M12 3v4"/></svg>',
  grid: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>',
  bowl: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11h16v4a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z"/><path d="M8 7h8"/></svg>',
  user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c0-3.8 3-5.8 7-5.8s7 2 7 5.8"/></svg>'
};

const TOOLS = [
  { icon: 'todo', label: '待办' },
  { icon: 'note', label: '便签' },
  { icon: 'wallet', label: '记账' },
  { icon: 'calendar', label: '倒数日' },
  { icon: 'news', label: '资讯' },
  { icon: 'food', label: '美食' }
];

const THEMES = [
  {
    id: 'azure', name: 'A · 青黛', tag: '当前实现',
    desc: '冷白底 + 蓝紫渐变，信息切分清晰。作为基准，和后两个方向对比。',
    colors: ['#F4F6FB', '#16203A', '#3B5BDB', '#E6EAF4']
  },
  {
    id: 'warm', name: 'B · 暖食', tag: '生活感',
    desc: '奶油底 + 橙色渐变。美食卡天然贴合，首页更有「过日子」的感觉，但工具感会弱一些。',
    colors: ['#FDF7F2', '#2A211C', '#E8590C', '#F1E3D8']
  },
  {
    id: 'plain', name: 'C · 素白', tag: '极简',
    desc: '近白底 + 墨黑主色，只保留必要颜色。最克制，适合想让内容本身说话的人。',
    colors: ['#FAFAFA', '#1B1B1B', '#1F2937', '#EAEAEA']
  }
];

function phone(t) {
  const cells = TOOLS.map(x => `
    <div class="cell">${I[x.icon]}<span class="label">${x.label}</span></div>`).join('');

  return `
  <section class="wrap">
    <div class="phone" data-theme="${t.id}">
      <div class="status"><span>20:20</span><span>●●●●</span></div>
      <div class="capsule"><span>···</span><span>⊙</span></div>
      <div class="navspace"></div>

      <div class="screen" id="home-${t.id}">
        <div class="hero">
          <div>
            <div class="hello">晚上好</div>
            <div class="date">10 月 22 日 · 周四</div>
          </div>
          <div class="edit">编辑</div>
        </div>

        <div class="sec"><span>我的工具 · 6</span><span class="more">全部</span></div>
        <div class="grid">${cells}</div>

        <div class="sec"><span>今日概览</span><span class="more">详情</span></div>
        <div class="summary">
          <div class="sitem"><div class="k">待办</div><div class="v">2<span class="unit">件</span></div></div>
          <div class="sdiv"></div>
          <div class="sitem"><div class="k">本月支出</div><div class="v">¥356</div></div>
          <div class="sdiv"></div>
          <div class="sitem"><div class="k">最近倒数</div><div class="v">10<span class="unit">天</span></div></div>
        </div>

        <div class="sec"><span>今天吃了什么</span><span class="more" onclick="showFood('${t.id}')">去记录</span></div>
        <div class="foodcard" onclick="showFood('${t.id}')">
          <div class="fleft">
            <div class="ft">豆浆油条 · 番茄牛腩面</div>
            <div class="fs">还想吃：日式咖喱、楼下的烤肉</div>
          </div>
          <div class="fright">2<small>顿</small></div>
        </div>

        <div class="sec"><span>协作群组</span><span class="more">管理</span></div>
        <div class="groups">
          <div class="gcard">
            <div><div class="gname">一家人</div><div class="gsub">本周 0 / 2 完成</div></div>
            <div class="gbar"><div class="gfill" style="width:12%"></div></div>
          </div>
          <div class="gcard">
            <div><div class="gname">周末露营</div><div class="gsub">周六出发前</div></div>
            <div class="gbar"><div class="gfill" style="width:40%"></div></div>
          </div>
        </div>

        <div class="sec"><span>动态</span><span class="more">全部</span></div>
        <div class="feed">
          <div class="fitem"><span class="fdot"></span><div class="ftxt">一家人 · 买周末的菜 新增</div><span class="ftime">12:40</span></div>
          <div class="fitem"><span class="fdot"></span><div class="ftxt">你 记录了「番茄牛腩面」</div><span class="ftime">12:10</span></div>
        </div>
      </div>

      <div class="screen hidden" id="food-${t.id}">
        <div class="fhead">
          <div class="ftitle">美食记录</div>
          <div class="fsub">10 月 22 日 · 周四 · 今天已记 2 顿</div>
        </div>

        <div class="seg">
          <div class="s on">今天吃了</div>
          <div class="s">想吃什么 2</div>
        </div>

        <div class="inputbar">
          <div class="ipt">刚吃了什么？</div>
          <div class="plus">＋</div>
        </div>

        <div class="flist">
          <div class="frow"><div class="l"><div class="c">番茄牛腩面</div><span class="t">12:10</span></div><span class="del">✕</span></div>
          <div class="frow"><div class="l"><div class="c">豆浆油条</div><span class="t">08:05</span></div><span class="del">✕</span></div>
          <div class="frow"><div class="l"><div class="c">日式咖喱</div><span class="t">想吃</span></div><span class="eaten">吃到了</span></div>
        </div>

        <div class="back" onclick="showHome('${t.id}')">‹ 返回首页</div>
      </div>

      <div class="tabbar">
        <div class="tab on" onclick="showHome('${t.id}')">${I.grid}<span>工具</span></div>
        <div class="tab" onclick="showFood('${t.id}')">${I.bowl}<span>美食</span></div>
        <div class="tab">${I.user}<span>我的</span></div>
      </div>
    </div>

    <div class="meta">
      <div class="mname">${t.name}<span class="mtag">${t.tag}</span></div>
      <p class="mdesc">${t.desc}</p>
      <div class="swatches">${t.colors.map(c => `<span class="sw" style="background:${c}"></span>`).join('')}</div>
    </div>
  </section>`;
}

function showFood(id) {
  document.getElementById('home-' + id).classList.add('hidden');
  document.getElementById('food-' + id).classList.remove('hidden');
}
function showHome(id) {
  document.getElementById('food-' + id).classList.add('hidden');
  document.getElementById('home-' + id).classList.remove('hidden');
}

document.getElementById('stage').innerHTML = THEMES.map(phone).join('');
</script>
</body>
</html>
