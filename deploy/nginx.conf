# 小程序 API：放入 lzy.benefitgpt.top 的 HTTPS server 块。
# 对应 server_name lzy.benefitgpt.top；证书由该站点配置管理。
# 管理站点使用 nginx-admin.conf，不要把两份片段放进同一个 server 块。

location /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # 用 $remote_addr 覆盖，不能用 $proxy_add_x_forwarded_for：
    # 后者会把客户端自己带的 X-Forwarded-For 原样保留在最左边，
    # 服务端取到的就是可伪造的 IP，限流一换 IP 就绕过。
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    # 这个 API 没有文件上传，卡死请求体大小
    client_max_body_size 256k;
}

# 该域名只提供 API。
location / {
    return 404;
}
