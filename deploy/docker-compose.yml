name: dailyuse

services:
  db:
    image: postgres:16-alpine
    container_name: dailyuse-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dailyuse}
      POSTGRES_USER: ${POSTGRES_USER:-dailyuse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 deploy/.env 中设置}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dailyuse} -d ${POSTGRES_DB:-dailyuse}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: ../server
    container_name: dailyuse-api
    environment:
      PORT: 3000
      TZ: ${TZ:-Asia/Shanghai}
      DATABASE_URL: postgresql://${POSTGRES_USER:-dailyuse}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dailyuse}
      JWT_SECRET: ${JWT_SECRET:?请在 deploy/.env 中设置}
      WX_APPID: ${WX_APPID:-}
      WX_SECRET: ${WX_SECRET:-}
      WX_TEMPLATE_ID: ${WX_TEMPLATE_ID:-}
      WX_WEATHER_TEMPLATE_ID: ${WX_WEATHER_TEMPLATE_ID:-}
      QWEATHER_KEY: ${QWEATHER_KEY:-}
      QWEATHER_HOST: ${QWEATHER_HOST:-}
      # 管理员 openid 白名单（逗号分隔）：能看反馈 / 发公告
      ADMIN_OPENIDS: ${ADMIN_OPENIDS:-}
      # 网页管理后台（/admin）的登录密码；留空 = 网页后台关闭
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ALLOW_DEV_LOGIN: ${ALLOW_DEV_LOGIN:-}
      TRUST_PROXY: ${TRUST_PROXY:-127.0.0.1,::1}
      PUSH_PER_KEYWORD_PER_DAY: ${PUSH_PER_KEYWORD_PER_DAY:-3}
      QUIET_START_HOUR: ${QUIET_START_HOUR:-22}
      QUIET_END_HOUR: ${QUIET_END_HOUR:-8}
      PAY_ENFORCED: ${PAY_ENFORCED:-0}
    depends_on:
      db:
        condition: service_healthy
    # 只绑本机，公网流量统一走已有 nginx
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

volumes:
  pgdata:
